<section id="projects" class="relative py-24 md:py-32">
  <!-- ambient glow -->
  <div class="pointer-events-none absolute left-1/2 top-0 h-72 w-[42rem] max-w-full -translate-x-1/2 rounded-full bg-indigo-600/[0.07] blur-[120px]"></div>

  <div class="relative mx-auto max-w-6xl px-6 md:px-8">
    <app-section-heading eyebrow="Selected Work" title="Featured Projects" />

    <div class="grid gap-6 md:grid-cols-2">
      @for (project of projects(); track project.title) {
        <!-- Featured project spans the full row -->
        <article
          class="glass card-lift group overflow-hidden"
          [class.md:col-span-2]="project.featured"
          appReveal
          [revealDelay]="$index * 80"
        >
          <div class="relative overflow-hidden" [class.h-64]="project.featured" [class.md:h-80]="project.featured" [class.h-48]="!project.featured">
            <img
              [src]="project.image"
              [alt]="'Project image for ' + project.title"
              width="600"
              height="400"
              loading="lazy"
              class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-[1.04]"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-ink-950/85 via-ink-950/20 to-transparent"></div>

            <!-- hover actions -->
            <div class="absolute right-4 top-4 flex translate-y-2 gap-2 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">
              <a
                [href]="project.liveUrl"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open live demo"
                class="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 bg-ink-950/70 text-slate-200 backdrop-blur transition-colors hover:border-cyan-400/50 hover:text-cyan-300"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
              </a>
              <a
                [href]="project.repoUrl"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open GitHub repository"
                class="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 bg-ink-950/70 text-slate-200 backdrop-blur transition-colors hover:border-cyan-400/50 hover:text-cyan-300"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" /></svg>
              </a>
            </div>

            @if (project.featured) {
              <span class="absolute left-4 top-4 rounded-full border border-cyan-400/30 bg-ink-950/70 px-3 py-1 font-mono text-[10px] uppercase tracking-[0.18em] text-cyan-300 backdrop-blur">
                Featured
              </span>
            }
          </div>

          <div class="p-6 md:p-7">
            <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
              <h3 class="font-display text-xl font-semibold text-white transition-colors group-hover:text-cyan-200">
                {{ project.title }}
              </h3>
              <span class="h-px flex-1 bg-white/[0.06] max-md:hidden"></span>
            </div>
            <p class="mt-3 text-sm leading-relaxed text-slate-400">
              {{ project.description }}
            </p>
            <div class="mt-5 flex flex-wrap gap-2">
              @for (tech of project.stack; track tech) {
                <span class="chip !text-xs">{{ tech }}</span>
              }
            </div>
          </div>
        </article>
      }
    </div>

    <p class="mt-10 text-center font-mono text-xs text-slate-600" appReveal>
      // More experiments live on
      <a href="https://github.com/ahmedheroo" target="_blank" rel="noopener noreferrer" class="text-cyan-400/80 underline-offset-4 transition-colors hover:text-cyan-300 hover:underline">GitHub</a>
    </p>
  </div>
</section>
