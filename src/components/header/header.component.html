<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.border-b]="isScrolled()"
  [class.border-white/[0.06]]="isScrolled()"
  [class.bg-ink-950/80]="isScrolled()"
  [class.backdrop-blur-xl]="isScrolled()"
  [class.shadow-[0_10px_40px_-15px_rgba(0,0,0,0.6)]]="isScrolled()"
>
  <nav class="container mx-auto flex max-w-6xl items-center justify-between px-6 py-4 md:px-8">
    <!-- Logo -->
    <a href="#" class="group flex items-center gap-3">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-cyan-400 to-indigo-500 font-display text-sm font-bold text-ink-950 shadow-lg shadow-cyan-500/25 transition-transform duration-300 group-hover:scale-105">
        AH
      </span>
      <span class="font-display text-lg font-semibold tracking-tight text-white">
        Ahmed<span class="text-cyan-400">.</span>Hassan
      </span>
    </a>

    <!-- Desktop nav -->
    <div class="hidden items-center gap-8 md:flex">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          class="group relative text-sm font-medium transition-colors duration-300"
          [class.text-cyan-300]="isActive(link.href)"
          [class.text-slate-400]="!isActive(link.href)"
          [class.hover:text-white]="!isActive(link.href)"
        >
          {{ link.label }}
          <span
            class="absolute -bottom-1.5 left-0 h-px bg-gradient-to-r from-cyan-400 to-indigo-400 transition-all duration-300"
            [class.w-full]="isActive(link.href)"
            [class.w-0]="!isActive(link.href)"
            [class.group-hover:w-full]="!isActive(link.href)"
          ></span>
        </a>
      }
    </div>

    <a href="#contact" class="btn-primary hidden !px-5 !py-2 text-xs md:inline-flex">
      Hire Me
    </a>

    <!-- Mobile toggle -->
    <button
      (click)="toggleNav()"
      aria-label="Toggle navigation menu"
      class="text-slate-200 transition-colors hover:text-cyan-300 focus:outline-none md:hidden"
    >
      @if (!navOpen()) {
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      } @else {
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>
  </nav>

  <!-- Mobile menu -->
  <div
    class="overflow-hidden border-b border-white/[0.06] bg-ink-950/95 backdrop-blur-xl transition-all duration-300 ease-out md:hidden"
    [class.max-h-[26rem]]="navOpen()"
    [class.max-h-0]="!navOpen()"
    [class.opacity-100]="navOpen()"
    [class.opacity-0]="!navOpen()"
  >
    <div class="flex flex-col gap-1 px-6 pb-6 pt-2">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          (click)="closeNav()"
          class="rounded-lg px-3 py-3 text-base font-medium transition-colors"
          [class.bg-white/[0.04]]="isActive(link.href)"
          [class.text-cyan-300]="isActive(link.href)"
          [class.text-slate-300]="!isActive(link.href)"
        >
          {{ link.label }}
        </a>
      }
      <a href="#contact" (click)="closeNav()" class="btn-primary mt-3 self-start">
        Hire Me
      </a>
    </div>
  </div>
</header>
