<section id="education" class="relative py-24 md:py-32">
  <div class="mx-auto max-w-5xl px-6 md:px-8">
    <app-section-heading eyebrow="Foundations" title="Education" />

    <div class="grid gap-6 md:grid-cols-2">
      @for (edu of educationHistory(); track edu.degree; let i = $index) {
        <article class="glass card-lift flex items-start gap-5 p-6 md:p-7" appReveal [revealDelay]="i * 80">
          <span class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-xl border border-cyan-400/20 bg-cyan-400/[0.08]">
            <svg class="h-6 w-6 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-9.998 12.078 12.078 0 01.665-6.479L12 14z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-9.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222 4 2.222V20M1 12v7a2 2 0 002 2h18a2 2 0 002-2v-7" />
            </svg>
          </span>
          <div>
            <h3 class="font-display text-lg font-semibold text-white">{{ edu.degree }}</h3>
            <p class="mt-1 text-sm font-medium text-cyan-400/90">{{ edu.institution }}</p>
            <p class="mt-2 font-mono text-xs text-slate-500">{{ edu.period }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
